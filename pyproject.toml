[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fulfilled-order-invoice"
version = "0.1.0"
description = "Generate invoice PDFs from fulfilled e-commerce order lines."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
invoice-service = "invoice_service:run"

[tool.setuptools]
py-modules = ["infrai_pdf", "order_models", "invoice_pipeline", "invoice_service"]
package-dir = {"" = "src"}

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
